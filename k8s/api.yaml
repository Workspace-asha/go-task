apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-task
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-task
  template:
    metadata:
      labels:
        app: go-task
    spec:
      containers:
      - name: api
        image: go-task:local
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: go-task
spec:
  selector:
    app: go-task
  ports:
  - port: 80
    targetPort: 8080